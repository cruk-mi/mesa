## Codecov configuration for mesa.
##
## The project status is informational: the package sits well below the 80%
## target named in AGENTS.md, so a failing project status would fail every PR
## for a pre-existing gap rather than for anything the PR did. The patch status
## fails below 80% on the lines a PR adds, so new code needs tests.
## Revisit the project status once coverage is near target.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "data-raw"
  - "vignettes"
