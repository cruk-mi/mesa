## Read more about GitHub actions the features of this GitHub Actions workflow
## at https://lcolladotor.github.io/biocthis/articles/biocthis.html#use_bioc_github_action
##
## For more details, check the biocthis developer notes vignette at
## https://lcolladotor.github.io/biocthis/articles/biocthis_dev_notes.html
##
## You can add this workflow to other packages using:
## > biocthis::use_bioc_github_action()
##
## Using GitHub Actions exposes you to many details about how R packages are
## compiled and installed in several operating system.s
### If you need help, please follow the steps listed at
## https://github.com/r-lib/actions#where-to-find-help
##
## If you found an issue specific to biocthis's GHA workflow, please report it
## with the information that will make it easier for others to help you.
## Thank you!

## Acronyms:
## * GHA: GitHub Action
## * OS: operating system

## Every check runs on every pull request. Pushes only trigger on main (for
## the pkgdown deploy): with `push:` on every branch, each push to an open PR
## started a second, identical run.
on:
  push:
    branches: [main]
    paths:
        - 'R/**'
        - 'tests/**'
        - 'vignettes/**'
        - 'inst/**'
        - 'DESCRIPTION'
        - 'NAMESPACE'
        - 'man/**'
  pull_request:
  workflow_dispatch:

name: R-CMD-check-bioc

## A new push to a pull request cancels its superseded run. Runs on main are
## never cancelled, so a pkgdown deploy is not cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

## These environment variables control whether to run GHA code later on that is
## specific to testthat, covr, and pkgdown.
##
## If you need to clear the cache of packages, update the number inside
## cache-version as discussed at https://github.com/r-lib/actions/issues/86.
## Note that you can always run a GHA test without the cache by using the word
## "/nocache" in the commit message.
##
## Layout: r-build-and-check, long-checks, coverage and pkgdown run in
## parallel, each after the shared .github/actions/setup-mesa. They used to be
## steps of one ~37-minute job, run one after the other.
env:
  has_testthat: 'true'
  run_covr: 'true'
  run_pkgdown: 'true'
  has_RUnit: 'false'
  cache-version: 'cache-v4'
  ## Shared by every R job below.
  R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
  RSPM: "https://packagemanager.posit.co/cran/__linux__/noble/latest"
  NOT_CRAN: true
  TZ: UTC
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ## Resolve the R and Bioconductor versions from the single source of truth
  ## (DESCRIPTION's `R (>=)` line) so upgrades only require editing that file.
  ## resolve_versions.sh derives the Bioc version + Docker tag from R.
  read-versions:
    runs-on: ubuntu-latest
    outputs:
      r-version: ${{ steps.parse.outputs.r-version }}
      bioc-version: ${{ steps.parse.outputs.bioc-version }}
      bioc-release: ${{ steps.parse.outputs.bioc-release }}
      roxygen-version: ${{ steps.parse.outputs.roxygen-version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Resolve versions
        id: parse
        run: |
          # Write to a file first so a resolver failure (set -euo pipefail)
          # aborts this step under the default `bash -eo pipefail`, instead of
          # being swallowed inside a `source <(...)` process substitution.
          resolved="$(mktemp)"
          bash .devcontainer/resolve_versions.sh > "$resolved"
          cat "$resolved" >> "$GITHUB_ENV"
          source "$resolved"
          echo "r-version=${R_VERSION_FULL}" >> "$GITHUB_OUTPUT"
          echo "bioc-version=${BIOC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bioc-release=${BIOC_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "roxygen-version=${ROXYGEN_VERSION}" >> "$GITHUB_OUTPUT"

  ## man/ and NAMESPACE are roxygen2 output. Nothing else checks that they
  ## match the roxygen comments in R/, so they can drift silently until a
  ## reviewer notices. Regenerate and fail on any diff.
  ##
  ## Runs the roxygen2 recorded in DESCRIPTION (Config/roxygen2/version), NOT
  ## the latest release -- otherwise every upstream roxygen release would turn
  ## this job red and it would become the churn it exists to prevent.
  ##
  ## Uses the devcontainer image because roxygenise() loads the package, which
  ## needs mesa's full dependency stack.
  roxygen-drift:
    needs: read-versions
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cruk-mi/mesa/devcontainer:codespaces-slim
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install any dependencies this branch adds
        # The image is rebuilt only on pushes to dev/main, so a PR that adds a
        # dependency to DESCRIPTION would otherwise fail in roxygenise() (which
        # loads the package) before the drift gate ever runs. dependencies = NA
        # is Depends/Imports/LinkingTo only: roxygenise() never needs Suggests,
        # which the slim image deliberately omits (genome and annotation data).
        run: |
          Rscript -e 'miss <- setdiff(
              remotes::local_package_deps(dependencies = NA),
              rownames(installed.packages()))
            if (length(miss)) {
              message("Installing missing dependencies: ", paste(miss, collapse = ", "))
              BiocManager::install(miss, ask = FALSE, update = FALSE)
            } else message("No missing dependencies.")'

      - name: Install the pinned roxygen2
        run: |
          Rscript -e 'v <- "${{ needs.read-versions.outputs.roxygen-version }}"
            if (!requireNamespace("roxygen2", quietly = TRUE) ||
                !identical(as.character(packageVersion("roxygen2")), v)) {
              remotes::install_version("roxygen2", version = v, upgrade = "never")
            }'

      - name: Regenerate documentation
        # clean = TRUE first deletes every file roxygen generated, so a page
        # whose object was removed or renamed in R/ shows up as a deletion in
        # the diff below instead of lingering and passing as in sync.
        run: Rscript -e 'roxygen2::roxygenise(clean = TRUE)'

      - name: Fail if man/ or NAMESPACE drifted
        run: |
          # The repo is checked out inside a container, so git may refuse to
          # operate on it as a different user.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          drifted=0
          git diff --exit-code -- man/ NAMESPACE DESCRIPTION || drifted=1
          # git diff ignores untracked files, so a man page missing from the
          # commit would be regenerated here and still look clean.
          untracked="$(git ls-files --others --exclude-standard -- man/ NAMESPACE)"
          if [ -n "$untracked" ]; then
            echo "Generated files missing from the commit:"
            echo "$untracked"
            drifted=1
          fi
          if [ "$drifted" -ne 0 ]; then
            echo "::error::man/, NAMESPACE or DESCRIPTION is out of sync with the roxygen comments in R/."
            echo "Run roxygen2::roxygenise() with roxygen2 ${{ needs.read-versions.outputs.roxygen-version }} and commit the result."
            exit 1
          fi
          echo "Documentation is in sync."

  r-build-and-check:
    needs: read-versions
    runs-on: ubuntu-latest
    name: R CMD check + BiocCheck
    container: "bioconductor/bioconductor_docker:${{ needs.read-versions.outputs.bioc-release }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up mesa
        uses: ./.github/actions/setup-mesa
        with:
          bioc-version: ${{ needs.read-versions.outputs.bioc-version }}
          r-version: ${{ needs.read-versions.outputs.r-version }}
          cache-version: ${{ env.cache-version }}

      - name: Install rcmdcheck and BiocCheck
        run: |
          message(paste('****', Sys.time(), 'installing rcmdcheck and BiocCheck ****'))
          remotes::install_cran("rcmdcheck")
          BiocManager::install("BiocCheck")
        shell: Rscript {0}

      - name: Install BiocGenerics
        if:  env.has_RUnit == 'true'
        run: |
          ## Install BiocGenerics
          BiocManager::install("BiocGenerics")
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Run CMD check
        env:
          _R_CHECK_CRAN_INCOMING_: false
        run: |
          ## R CMD build builds the vignettes once. R CMD check then re-builds
          ## them ("checking re-building of vignette outputs"), which
          ## Bioconductor requires to pass, and in that case skips the separate
          ## "running R code from vignettes" step
          ## (_R_CHECK_VIGNETTES_SKIP_RUN_MAYBE_ defaults to TRUE). So the
          ## vignettes run twice per check, as on the Bioconductor builders.
          ## --no-build-vignettes used to swap the re-build for that code run:
          ## same cost, but the Bioconductor step reported SKIPPED.
          rcmdcheck::rcmdcheck(
              args = c("--no-manual", "--timings"),
              build_args = c("--no-manual", "--no-resave-data"),
              error_on = "warning",
              check_dir = "check"
          )
        shell: Rscript {0}

      ## Might need an to add this to the if:  && runner.os == 'Linux'
      - name: Reveal testthat details
        if:  env.has_testthat == 'true'
        run: find . -name testthat.Rout -exec cat '{}' ';'

      - name: Run RUnit tests
        if:  env.has_RUnit == 'true'
        run: |
          BiocGenerics:::testPackage()
        shell: Rscript {0}

      - name: Run BiocCheck
        run: |
          BiocCheck::BiocCheck(
              dir('check', 'tar.gz$', full.names = TRUE),
              `quit-with-status` = FALSE,
              `no-check-R-ver` = TRUE,
              `no-check-bioc-help` = TRUE
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-biocversion-${{ needs.read-versions.outputs.bioc-version }}-r-${{ needs.read-versions.outputs.r-version }}-results
          path: check

  long-checks:
    needs: read-versions
    runs-on: ubuntu-latest
    name: Long checks (read-count regression)
    container: "bioconductor/bioconductor_docker:${{ needs.read-versions.outputs.bioc-release }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up mesa
        uses: ./.github/actions/setup-mesa
        with:
          bioc-version: ${{ needs.read-versions.outputs.bioc-version }}
          r-version: ${{ needs.read-versions.outputs.r-version }}
          cache-version: ${{ env.cache-version }}

      - name: Run long checks (read-count regression)
        if:  env.has_testthat == 'true'
        run: |
          ## tests/testthat.R sets skip_long_checks = TRUE unconditionally, so
          ## R CMD check never runs the blocks guarded by it. One of those,
          ## expect_equal(enr$nReads, 636130) in test-makeQset.R, is the only
          ## exact check that calculateCGEnrichment() still returns the read
          ## counts mesa has always returned for this data - so without this
          ## step nothing catches a silent change to them (#81, #102).
          ##
          ## This runner already installs MEDIPSData and
          ## BSgenome.Hsapiens.UCSC.hg19, so the block can run here with the
          ## option disabled. Scoped to makeQset to keep the added runtime to
          ## the tests that need the heavy data.
          options(skip_long_checks = FALSE)
          BiocParallel::register(BiocParallel::SerialParam())
          testthat::test_dir(
              "tests/testthat",
              package = "mesa",
              load_package = "installed",
              filter = "makeQset",
              stop_on_failure = TRUE
          )
        shell: Rscript {0}

  pkgdown:
    needs: read-versions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: pkgdown site
    container: "bioconductor/bioconductor_docker:${{ needs.read-versions.outputs.bioc-release }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up mesa
        uses: ./.github/actions/setup-mesa
        with:
          bioc-version: ${{ needs.read-versions.outputs.bioc-version }}
          r-version: ${{ needs.read-versions.outputs.r-version }}
          cache-version: ${{ env.cache-version }}

      - name: Install pkgdown
        run: |
          remotes::install_cran("pkgdown")
        shell: Rscript {0}

      - name: Install package
        run: R CMD INSTALL .

      - name: Deploy package
        if: github.ref == 'refs/heads/main' && env.run_pkgdown == 'true' && runner.os == 'Linux'
        run: |
          git config --global --add safe.directory /__w/mesa/mesa
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e "pkgdown::deploy_to_branch(new_process = FALSE)"
        shell: bash {0}
        ## Note that you need to run pkgdown::deploy_to_branch(new_process = FALSE)
        ## at least one locally before this will work. This creates the gh-pages
        ## branch (erasing anything you haven't version controlled!) and
        ## makes the git history recognizable by pkgdown.

  coverage:
    needs: read-versions
    runs-on: ubuntu-latest
    name: Test coverage
    container: "bioconductor/bioconductor_docker:${{ needs.read-versions.outputs.bioc-release }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up mesa
        uses: ./.github/actions/setup-mesa
        with:
          bioc-version: ${{ needs.read-versions.outputs.bioc-version }}
          r-version: ${{ needs.read-versions.outputs.r-version }}
          cache-version: ${{ env.cache-version }}

      - name: Install covr
        run: |
          remotes::install_cran("covr")
        shell: Rscript {0}

      - name: Test coverage
        if: env.run_covr == 'true' && runner.os == 'Linux'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          ## covr::codecov() returns the parsed HTTP response invisibly and
          ## never inspects the status, so a rejected upload leaves this step
          ## green. Uploads failed unnoticed from 2026-06-17 for exactly that
          ## reason: first a 429 rate limit, then a 404 on a stale token.
          ## Treat anything without a success marker as a failure, and print
          ## the response so the cause is visible in the log.
          ##
          ## Success is the commit page Codecov links to. The host is anchored,
          ## because error bodies link to docs.codecov.io and a bare
          ## "codecov.io" match would score those as uploads.
          commit_url <- paste0("^https://(app\\.)?codecov\\.io/",
                               "(gh|github)/[^/]+/[^/]+/commit/[0-9a-f]{7,40}")
          uploaded <- function(res) {
              lines <- if (is.list(res)) {
                  if (isTRUE(res$uploaded)) "uploaded" else as.character(res$url)
              } else if (is.character(res)) {
                  unlist(strsplit(res, "[[:space:]]+"))
              } else {
                  character(0)
              }
              ## length() first: as.character(character(0))[1] is NA, and
              ## nzchar(NA) is TRUE, so an empty url used to score as success.
              length(lines) > 0 &&
                  (identical(lines, "uploaded") || any(grepl(commit_url, lines)))
          }
          ## Fork PRs get no secrets, so CODECOV_TOKEN is empty and a tokenless
          ## upload is expected to be refused. Try once and report it, but do
          ## not fail an external contributor's check for it.
          has_token <- nzchar(Sys.getenv("CODECOV_TOKEN"))
          attempts <- if (has_token) 3L else 1L
          ## Measure once; only the upload is retried, to ride out a transient
          ## 429 or 5xx from Codecov.
          cov <- covr::package_coverage()
          ok <- FALSE
          for (i in seq_len(attempts)) {
              res <- tryCatch(covr::codecov(coverage = cov),
                              error = function(e) conditionMessage(e))
              print(res)
              ok <- uploaded(res)
              if (ok || i == attempts) break
              message("Codecov upload attempt ", i, " rejected; retrying.")
              Sys.sleep(30 * i)
          }
          if (!has_token) {
              message("No CODECOV_TOKEN (fork PR?): upload not verified.")
              quit(save = "no", status = 0)
          }
          if (!ok) {
              stop("Codecov upload failed after ", attempts,
                   " attempts; see the responses printed above.")
          }
        shell: Rscript {0}
