name: Build Devcontainer Images
on:
  push:
    branches: [ dev, main ]
    paths:
      - '.devcontainer/**'
      - 'DESCRIPTION'
      - '.github/workflows/**'
  # Build-only check, so a broken image fails the PR instead of main.
  # Nothing is pushed, no registry login, no cache write; a fork's
  # pull_request token is read-only anyway.
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [ slim, full ]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve versions
        run: bash .devcontainer/resolve_versions.sh >> "$GITHUB_ENV"
      - name: Build & Push ${{ matrix.variant }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          build-args: |
            VARIANT=${{ matrix.variant }}
            BIOC_VERSION=${{ env.BIOC_VERSION }}
            BIOC_RELEASE=${{ env.BIOC_RELEASE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/cruk-mi/mesa/devcontainer:${{ matrix.variant == 'slim' && 'codespaces-slim' || 'full' }}
          cache-from: type=registry,ref=ghcr.io/cruk-mi/mesa/devcontainer:cache-${{ matrix.variant }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/cruk-mi/mesa/devcontainer:cache-{0},mode=max', matrix.variant) || '' }}
      - name: Tag latest = codespaces-slim
        if: matrix.variant == 'slim' && github.event_name != 'pull_request'
        run: |
          docker buildx imagetools create -t ghcr.io/cruk-mi/mesa/devcontainer:latest ghcr.io/cruk-mi/mesa/devcontainer:codespaces-slim