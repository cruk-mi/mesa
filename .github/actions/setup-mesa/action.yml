## Shared setup for the check-bioc.yml jobs: R library, dependency cache,
## system dependencies, Bioconductor, and mesa's dependencies.
##
## Expects to run inside the bioconductor/bioconductor_docker container after
## actions/checkout, with RSPM and GITHUB_PAT set in the job's env.
##
## The vignettes are NOT built here. install_local() used to be called with
## build_vignettes = TRUE and force = TRUE in both passes, so the five
## vignettes were built twice (~7.5 min) into a package nothing checks. R CMD
## build and R CMD check build and verify them in r-build-and-check.

name: Set up mesa
description: Restore the R package cache and install mesa's dependencies.

inputs:
  bioc-version:
    description: Bioconductor version, from the read-versions job.
    required: true
  r-version:
    description: R version, from the read-versions job. Only used in the cache key.
    required: true
  cache-version:
    description: Bump to invalidate the R package cache.
    required: false
    default: 'cache-v4'

runs:
  using: composite
  steps:
    ## Set the R library to the directory matching the R packages cache step
    ## below when running on Docker (Linux).
    - name: Set R Library home on Linux
      shell: bash
      run: |
        mkdir -p /__w/_temp/Library
        echo ".libPaths('/__w/_temp/Library')" > ~/.Rprofile

    - name: Query dependencies
      shell: Rscript {0}
      run: |
        install.packages('remotes')
        saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)

    ## Note that you can always run a GHA test without the cache by using the
    ## word "/nocache" in the commit message.
    - name: Cache R packages on Linux
      if: "!contains(github.event.head_commit.message, '/nocache')"
      uses: actions/cache@v6
      with:
        path: /home/runner/work/_temp/Library
        key: ${{ inputs.cache-version }}-${{ runner.os }}-biocversion-${{ inputs.bioc-version }}-r-${{ inputs.r-version }}-${{ hashFiles('.github/depends.Rds') }}
        restore-keys: ${{ inputs.cache-version }}-${{ runner.os }}-biocversion-${{ inputs.bioc-version }}-r-${{ inputs.r-version }}-

    - name: Install Linux system dependencies
      shell: bash
      run: |
        sysreqs=$(Rscript -e 'cat("apt-get update -y && apt-get install -y", paste(gsub("apt-get install -y ", "", remotes::system_requirements("ubuntu", "20.04")), collapse = " "))')
        echo $sysreqs
        sudo -s eval "$sysreqs"
        sudo apt-get install -y nginx

    - name: Install BiocManager
      shell: Rscript {0}
      run: |
        message(paste('****', Sys.time(), 'installing BiocManager ****'))
        remotes::install_cran("BiocManager")

    - name: Set BiocVersion
      shell: Rscript {0}
      run: |
        BiocManager::install(version = "${{ inputs.bioc-version }}", ask = FALSE)

    - name: Install dependencies pass 1
      shell: Rscript {0}
      run: |
        ## Try installing the package dependencies in steps. First the local
        ## dependencies, then any remaining dependencies to avoid the
        ## issues described at
        ## https://stat.ethz.ch/pipermail/bioc-devel/2020-April/016675.html
        ## https://github.com/r-lib/remotes/issues/296
        ## Ideally, all dependencies should get installed in the first pass.
        ##
        ## A failure here is tolerated (pass 2 retries), so it is caught in R:
        ## a composite action cannot rely on continue-on-error.
        message(paste('****', Sys.time(), 'pass number 1 at installing dependencies: local dependencies ****'))
        tryCatch(
            remotes::install_local(dependencies = TRUE, repos = BiocManager::repositories(), build_vignettes = FALSE, upgrade = TRUE),
            error = function(e) message("Pass 1 failed, pass 2 will retry: ", conditionMessage(e))
        )

    - name: Install dependencies pass 2
      shell: Rscript {0}
      run: |
        message(paste('****', Sys.time(), 'pass number 2 at installing dependencies: any remaining dependencies ****'))
        remotes::install_local(dependencies = TRUE, repos = BiocManager::repositories(), build_vignettes = FALSE, upgrade = TRUE)
