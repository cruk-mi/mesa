<title>mesa Next Steps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    /* Teal-biased neutrals: a lab instrument, not a marketing page. */
    --ground: #f5f8f8;
    --surface: #ffffff;
    --surface-2: #eef3f3;
    --line: #d3dedd;
    --ink: #17211f;
    --ink-2: #4d5c5a;
    --ink-3: #7b8a88;
    --accent: #0f6e6a;
    --ok: #2c7048;
    --warn: #8a5f11;
    --bad: #9d2f2f;
    --ok-bg: #e6f1ea;
    --warn-bg: #f7efdd;
    --bad-bg: #f6e5e5;
    --info: #3b5a8c;
    --info-bg: #e5ebf5;
    --accent-bg: #e1efee;
    --radius: 6px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0d1413;
      --surface: #141d1c;
      --surface-2: #1b2625;
      --line: #2b3837;
      --ink: #e4ecea;
      --ink-2: #a5b4b2;
      --ink-3: #788886;
      --accent: #4bb5ad;
      --ok: #62b487;
      --warn: #d0a14e;
      --bad: #e08585;
      --ok-bg: #16281f;
      --warn-bg: #2b2415;
      --bad-bg: #2c1a1a;
      --info: #8fb0e6;
      --info-bg: #182234;
      --accent-bg: #15302e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0d1413;
    --surface: #141d1c;
    --surface-2: #1b2625;
    --line: #2b3837;
    --ink: #e4ecea;
    --ink-2: #a5b4b2;
    --ink-3: #788886;
    --accent: #4bb5ad;
    --ok: #62b487;
    --warn: #d0a14e;
    --bad: #e08585;
    --ok-bg: #16281f;
    --warn-bg: #2b2415;
    --bad-bg: #2c1a1a;
    --info: #8fb0e6;
    --info-bg: #182234;
    --accent-bg: #15302e;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 28px 56px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  code, .mono, th, .num { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  code {
    font-size: 0.88em;
    background: var(--surface-2);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }

  /* ---- masthead ---- */
  .masthead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
  .masthead h1 {
    font-family: "IBM Plex Mono", monospace;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .version {
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px;
    color: var(--ink-2);
  }
  .version .devel { color: var(--accent); font-weight: 600; }
  .phase {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink-3);
    margin-left: auto;
  }

  /* ---- readouts: severity stripe, no card chrome ---- */
  .readouts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .readout { background: var(--surface); padding: 13px 15px 14px; border-left: 3px solid var(--line); }
  .readout.is-ok { border-left-color: var(--ok); }
  .readout.is-warn { border-left-color: var(--warn); }
  .readout.is-bad { border-left-color: var(--bad); }
  .readout .label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-3);
    margin-bottom: 5px;
  }
  .readout .value {
    font-family: "IBM Plex Mono", monospace;
    font-size: 19px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .readout .note { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
  .meter { height: 3px; background: var(--surface-2); border-radius: 2px; margin-top: 7px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--warn); }

  /* ---- panels ---- */
  .cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 22px; align-items: start; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  section { min-width: 0; }
  section > h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.11em;
    color: var(--ink-3);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }

  /* the recommendation is the one thing that is lifted */
  .rec {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .rec h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.11em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .rec p { margin: 0 0 9px; max-width: 68ch; }
  .rec ul { margin: 0; padding-left: 18px; }
  .rec li { margin-bottom: 6px; max-width: 66ch; }
  .rec > :last-child { margin-bottom: 0; }

  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row .id {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    color: var(--ink-3);
    flex: none;
    min-width: 3.4em;
  }
  .row .body { flex: 1; min-width: 0; }
  .row .title { display: block; }
  .row .sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-3);
    word-break: break-all;
  }
  .pill {
    flex: none;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 1px 7px;
    border-radius: 99px;
    background: var(--surface-2);
    color: var(--ink-2);
  }
  .pill.is-ok { background: var(--ok-bg); color: var(--ok); }
  .pill.is-warn { background: var(--warn-bg); color: var(--warn); }
  .pill.is-bad { background: var(--bad-bg); color: var(--bad); }
  .group-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-2);
    margin: 14px 0 3px;
  }
  .group-label:first-child { margin-top: 0; }

  .tally { display: flex; gap: 16px; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .tally div { font-size: 13px; }
  .tally b { font-size: 17px; font-weight: 600; display: block; }
  .tally .e b { color: var(--bad); }
  .tally .w b { color: var(--warn); }
  .tally .n b { color: var(--ink-2); }
  .findings { margin: 12px 0 0; padding: 0; list-style: none; }
  .findings li {
    font-size: 12.5px;
    padding: 7px 0 0;
    border-top: 1px solid var(--line);
    color: var(--ink-2);
  }
  .findings li::before { content: "\2716"; color: var(--bad); margin-right: 7px; }

  .trend { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; }
  .trend th {
    text-align: left;
    font-weight: 500;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    padding: 0 8px 4px 0;
    border-bottom: 1px solid var(--line);
  }
  .trend td { padding: 4px 8px 4px 0; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line); }
  .trend tr:last-child td { border-bottom: 0; }

  .prose p { margin: 0 0 9px; max-width: 68ch; }
  .prose ul { margin: 0 0 9px; padding-left: 18px; }
  .prose li { margin-bottom: 5px; max-width: 66ch; }
  .prose > :last-child { margin-bottom: 0; }
  .muted { color: var(--ink-2); }

  details.prune {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 15px;
  }
  details.prune summary { cursor: pointer; font-size: 13px; }
  details.prune summary::marker { color: var(--ink-3); }
  details.prune[open] summary { margin-bottom: 10px; }
  pre.sh {
    background: var(--surface-2);
    border-radius: 4px;
    padding: 11px 12px;
    overflow-x: auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    line-height: 1.7;
    margin: 0 0 10px;
  }
  .warnbox {
    background: var(--warn-bg);
    border-left: 3px solid var(--warn);
    border-radius: 4px;
    padding: 10px 13px;
    font-size: 12.5px;
    color: var(--warn);
  }
  .badbox {
    background: var(--bad-bg);
    border-left: 3px solid var(--bad);
    border-radius: 4px;
    padding: 10px 13px;
    font-size: 12.5px;
    color: var(--bad);
  }
  footer {
    border-top: 1px solid var(--line);
    padding-top: 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  /* ---- shell: masthead + tabs, shared by both views ---- */
  .top { display: flex; flex-direction: column; gap: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: -12px; }
  .tabs button {
    font: 500 13px "IBM Plex Sans", system-ui, sans-serif;
    color: var(--ink-2);
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 8px 12px 9px;
    margin-bottom: -1px;
    cursor: pointer;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: flex; flex-direction: column; gap: 28px; min-width: 0; }

  /* ---- next steps ---- */
  .facts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 1px; background: var(--line); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
  }
  .fact { background: var(--surface); padding: 12px 15px; display: flex; flex-direction: column; gap: 2px; }
  .fact .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); }
  .fact .value { font-family: "IBM Plex Mono", monospace; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .fact .value.hot { color: var(--bad); }
  .fact .note { font-size: 11.5px; color: var(--ink-3); }
  .fact .meter i { background: var(--ok); }

  .donext { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; align-items: start; }
  @media (max-width: 760px) { .donext { grid-template-columns: 1fr; } }
  .donext .rec { height: 100%; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 16px 18px;
  }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.11em; color: var(--accent); margin-bottom: 10px; }
  .card ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: n; }
  .card li { display: grid; grid-template-columns: 1.6em 1fr; gap: 2px 8px; }
  .card li::before {
    counter-increment: n; content: counter(n); grid-row: span 2;
    font-family: "IBM Plex Mono", monospace; color: var(--accent); font-weight: 600;
  }
  .card li b { font-weight: 600; }
  .card li .sub { font-size: 12.5px; color: var(--ink-2); }

  .timeline { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .timeline svg { display: block; min-width: 620px; width: 100%; height: auto; }
  .tl-grid { stroke: var(--line); stroke-width: 1; }
  .tl-tick { fill: var(--ink-3); font: 500 11px "IBM Plex Mono", monospace; }
  .tl-name { fill: var(--ink); font: 500 12px "IBM Plex Sans", sans-serif; }
  .tl-bar { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1; }
  .tl-fill { fill: var(--accent); opacity: 0.55; }
  .tl-rel { fill: var(--accent); }
  .tl-rel.is-future { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
  .tl-rel-t { fill: var(--accent); font: 600 11px "IBM Plex Mono", monospace; }
  .tl-today { stroke: var(--info); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .tl-today-t { fill: var(--info); font: 600 11px "IBM Plex Mono", monospace; }
  .tl-dead { stroke: var(--bad); stroke-width: 2; }
  .tl-dead-t { fill: var(--bad); font: 600 11px "IBM Plex Mono", monospace; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 13px; }
  .filters label { display: inline-flex; gap: 7px; align-items: center; color: var(--ink-2); }
  .filters select {
    font: 500 13px "IBM Plex Sans", system-ui, sans-serif; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px;
  }
  .filters input { accent-color: var(--accent); }
  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 18px; font-size: 12px; color: var(--ink-2); }
  .legend div { display: flex; gap: 8px; align-items: baseline; }

  .chip {
    flex: none; font-size: 11px; font-weight: 500; white-space: nowrap;
    padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; line-height: 1.6;
  }
  .chip.st-todo { color: var(--accent); background: var(--accent-bg); }
  .chip.st-waiting { color: var(--warn); background: var(--warn-bg); }
  .chip.st-review { color: var(--info); background: var(--info-bg); }
  .chip.st-done { color: var(--ok); background: var(--ok-bg); }
  .chip.st-later { color: var(--ink-3); background: var(--surface-2); }
  .chip.owner { color: var(--ink-2); background: var(--surface); border-style: dashed; }

  .wave { display: flex; flex-direction: column; gap: 10px; }
  .wave > h2 {
    font-size: 16px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
    text-transform: none; letter-spacing: 0; color: var(--ink); border-bottom: 0; padding-bottom: 0; margin-bottom: 0;
  }
  .wave h2 .when { font: 500 12px "IBM Plex Mono", monospace; color: var(--ink-3); }
  .wave > p { margin: 0; color: var(--ink-2); max-width: 68ch; }
  ol.items { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  ol.items > li {
    display: grid; grid-template-columns: 2em 1fr auto; gap: 4px 12px;
    padding: 11px 14px; border-top: 1px solid var(--line); align-items: start;
  }
  ol.items > li:first-child { border-top: 0; }
  ol.items > li.is-done .what b { color: var(--ink-2); font-weight: 500; }
  .n { font-family: "IBM Plex Mono", monospace; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .what { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .what b { font-weight: 600; }
  .what .why { color: var(--warn); font-size: 12.5px; }
  .what .note { color: var(--ink-2); font-size: 13px; max-width: 72ch; }
  .what .refs { display: flex; flex-wrap: wrap; gap: 2px 14px; font: 12px "IBM Plex Mono", monospace; color: var(--ink-3); }
  .what .refs a { font-weight: 500; }
  .tags { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .empty { color: var(--ink-3); font-size: 13px; padding: 4px 0; }

  .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .tbl table { border-collapse: collapse; width: 100%; min-width: 520px; }
  .tbl th, .tbl td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; font-size: 13px; }
  .tbl thead th { border-top: 0; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; background: var(--surface-2); }
  .tbl td.num { white-space: nowrap; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .ships { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .ships span { white-space: nowrap; }
  .mark-done { color: var(--ok); } .mark-open { color: var(--ink-3); }

  details.guide { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 15px; }
  details.guide summary { cursor: pointer; font-weight: 500; }
  details.guide[open] summary { margin-bottom: 12px; }
  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 22px; }
  .rules h3 { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .rules p, .rules li { color: var(--ink-2); font-size: 13px; margin: 0; }
  .rules ul { margin: 0; padding-left: 18px; }
  .howto { font-size: 12.5px; color: var(--ink-2); max-width: 80ch; }

  @media (max-width: 560px) {
    ol.items > li { grid-template-columns: 1.6em 1fr; }
    .tags { grid-column: 2; flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
  }
</style>

<div class="wrap" id="wrap">
  <div class="top" id="top"></div>
  <div class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="tab-next" aria-controls="next" aria-selected="true">Next steps</button>
    <button type="button" role="tab" id="tab-health" aria-controls="app" aria-selected="false" tabindex="-1">Health</button>
  </div>
  <div class="panel" id="next" role="tabpanel" aria-labelledby="tab-next"></div>
  <div class="panel" id="app" role="tabpanel" aria-labelledby="tab-health" hidden></div>
</div>

<script id="status-data" type="application/json">/*__STATUS_JSON__*/</script>
<script>
  (function () {
    var DATA = JSON.parse(document.getElementById("status-data").textContent);
    var app = document.getElementById("app");
    var top = document.getElementById("top");
    var nextPanel = document.getElementById("next");

    function el(tag, cls, text) {
      var node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    /* Minimal inline markdown: the source is NEWS.md and our own recommendation,
       so only code spans, bold, links and bullets need to survive. */
    function inline(text) {
      var out = "";
      var i = 0;
      while (i < text.length) {
        var rest = text.slice(i);
        var m = rest.match(/^`([^`]+)`/);
        if (m) { out += "<code>" + esc(m[1]) + "</code>"; i += m[0].length; continue; }
        m = rest.match(/^\*\*([^*]+)\*\*/);
        if (m) { out += "<strong>" + esc(m[1]) + "</strong>"; i += m[0].length; continue; }
        m = rest.match(/^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/);
        if (m) {
          out += '<a href="' + esc(m[2]) + '" target="_blank" rel="noopener">' + esc(m[1]) + "</a>";
          i += m[0].length; continue;
        }
        out += esc(rest[0]); i += 1;
      }
      return out;
    }
    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function prose(lines, cls) {
      var box = el("div", cls || "prose");
      var para = [];
      var list = null;
      function flushPara() {
        if (!para.length) return;
        var p = el("p");
        p.innerHTML = inline(para.join(" "));
        box.appendChild(p);
        para = [];
      }
      (lines || []).forEach(function (raw) {
        var line = raw.replace(/\s+$/, "");
        var bullet = line.match(/^\s*[-*]\s+(.*)$/);
        if (bullet) {
          flushPara();
          if (!list) { list = el("ul"); box.appendChild(list); }
          var li = el("li");
          li.innerHTML = inline(bullet[1]);
          li.dataset.open = "1";
          list.appendChild(li);
          return;
        }
        if (!line.trim()) { flushPara(); list = null; return; }
        // An indented line continues the bullet above it.
        if (list && /^\s{2,}\S/.test(raw)) {
          var last = list.lastChild;
          last.innerHTML = last.innerHTML + " " + inline(line.trim());
          return;
        }
        list = null;
        if (/^#{1,6}\s/.test(line)) { flushPara(); box.appendChild(el("p", "muted", line.replace(/^#+\s*/, ""))); return; }
        para.push(line.trim());
      });
      flushPara();
      return box;
    }

    function section(title, node) {
      var s = el("section");

      details.appendChild(summary);

      // Matches the Markdown renderer: a git ref may contain ; $ ` & | ( ), and

      var shq = function (name) { return "'" + String(name).replace(/'/g, "'\\''") + "'"; };
      var localNames = prunable.filter(function (b) { return b.where.indexOf("local") === 0 || b.where === "local+remote"; })
                               .map(function (b) { return shq(b.branch); });

    var tree = DATA.worktree || {};

    // =====================================================================
    // Next steps: the roadmap from #124, every status derived by the script
    // =====================================================================
    var RM = DATA.roadmap;
    var STATUS = {

    var ORDER = ["todo", "waiting", "review", "done", "later"];
    var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    function store(key, value) {

    }
    function parseDay(text) {

    }
    function todayUTC() {
      var d = new Date();

    function renderNext() {

          '<a href="https://github.com/' + esc(DATA.repo) + '/issues/124" target="_blank" rel="noopener">#124</a>. ' +
          "The reason is under Incomplete data above. Fix the block, then run <code>/mesa-status</code>.";
        nextPanel.appendChild(box);

      var items = RM.items;

      // ---- facts --------------------------------------------------------

      fact("Target", RM.target || "?", "roadmap in #" + RM.issue);
      var dl = parseDay(RM.deadline);
      if (dl != null) {
        var days = Math.round((dl - todayUTC()) / 864e5);

             (days >= 0 ? days + " days left" : Math.abs(days) + " days ago") + " · estimated", days <= 21);
      }

           RM.counts.review + " in review · " + RM.counts.waiting + " waiting", false,

      function applyFilter() {

          var box = el("div", "ships");
          r.items.forEach(function (i) {
            var s = el("span");
            s.appendChild(el("span", i.status === "done" ? "mark-done" : "mark-open", i.status === "done" ? "✓ " : "○ "));
            s.appendChild(document.createTextNode(i.title));
            box.appendChild(s);
          });
          ships.appendChild(box);
        } else {
          ships.textContent = r.note || "";
          ships.className = "muted";
        }
        tr.appendChild(ships);
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      tbl.appendChild(table);
      nextPanel.appendChild(section("Release calendar", tbl));

      // ---- how to change the plan + working guide --------------------------
      var how = el("p", "howto");
      how.innerHTML = "Statuses are never set by hand: <code>/mesa-status</code> derives each one from the issues, " +
        "PRs, branches and tags an item names, and a hook runs it after any session that changed GitHub. " +
        "To add, drop, reorder or re-note an item, edit the <b>Roadmap data</b> block in " +
        '<a href="https://github.com/' + esc(DATA.repo) + '/issues/' + RM.issue + '" target="_blank" rel="noopener">#' +
        RM.issue + "</a>.";
      nextPanel.appendChild(how);
      nextPanel.appendChild(guide());
    }

    function timeline() {
      // One scale for everything: x = left + (day - start) * pxPerDay.
      var dated = RM.waves.filter(function (w) { return !w.later && w.start && w.end; });
      var wrap = el("div", "timeline");
      if (!dated.length) return wrap;
      var laterWave = RM.waves.filter(function (w) { return w.later; })[0];
      var points = [];
      dated.forEach(function (w) { points.push(parseDay(w.start), parseDay(w.end)); });
      RM.releases.forEach(function (r) { if (r.date) points.push(parseDay(r.date)); });
      if (RM.deadline) points.push(parseDay(RM.deadline));
      var t0 = Math.min.apply(null, points) - 2 * 864e5;
      var t1 = Math.max.apply(null, points) + 3 * 864e5;
      var W = 960, left = 190, right = 16 + (laterWave ? 70 : 0);
      var rowH = 30, topPad = 46, rows = dated.length + (laterWave ? 1 : 0);
      var relY = topPad + rows * rowH + 14, H = relY + 40;
      var ppd = (W - left - right) / ((t1 - t0) / 864e5);
      function x(t) { return left + (t - t0) / 864e5 * ppd; }
      var ns = "http://www.w3.org/2000/svg";
      function s(tag, attrs, text) {
        var n = document.createElementNS(ns, tag);
        for (var k in attrs) n.setAttribute(k, attrs[k]);
        if (text != null) n.textContent = text;
        return n;
      }
      var svg = s("svg", { viewBox: "0 0 " + W + " " + H, role: "img",
        "aria-label": "Timeline of the waves, releases and the acceptance deadline" });
      // Weekly ticks on Mondays.
      var d = new Date(t0), first = t0 + ((8 - d.getUTCDay()) % 7) * 864e5;
      for (var t = first; t <= t1; t += 7 * 864e5) {
        svg.appendChild(s("line", { "class": "tl-grid", x1: x(t), y1: topPad - 8, x2: x(t), y2: relY + 4 }));
        svg.appendChild(s("text", { "class": "tl-tick", x: x(t), y: 16, "text-anchor": "middle" },
          fmtDay(new Date(t).toISOString())));
      }
      dated.forEach(function (w, i) {
        var y = topPad + i * rowH;
        var inWave = RM.items.filter(function (it) { return it.wave === w.id; });
        var frac = inWave.length ? inWave.filter(function (it) { return it.status === "done"; }).length / inWave.length : 0;
        var x0 = x(parseDay(w.start)), x1 = x(parseDay(w.end) + 864e5);
        svg.appendChild(s("text", { "class": "tl-name", x: 8, y: y + 13 }, w.name.replace(/\s*\(.*\)$/, "")));
        svg.appendChild(s("rect", { "class": "tl-bar", x: x0, y: y, width: Math.max(4, x1 - x0), height: 18, rx: 3 }));
        if (frac > 0) svg.appendChild(s("rect", { "class": "tl-fill", x: x0, y: y, width: Math.max(2, (x1 - x0) * frac), height: 18, rx: 3 }));
      });
      if (laterWave) {
        var yl = topPad + dated.length * rowH;
        svg.appendChild(s("text", { "class": "tl-name", x: 8, y: yl + 13 }, laterWave.name.replace(/\s*\(.*\)$/, "")));
        svg.appendChild(s("text", { "class": "tl-tick", x: W - 10, y: yl + 13, "text-anchor": "end" },
          (laterWave.start ? fmtDay(laterWave.start) + " " : "") + "→"));
      }
      var today = todayUTC();
      if (today >= t0 && today <= t1) {
        svg.appendChild(s("line", { "class": "tl-today", x1: x(today), y1: topPad - 8, x2: x(today), y2: relY + 4 }));
        svg.appendChild(s("text", { "class": "tl-today-t", x: x(today) + 4, y: topPad - 14 }, "today"));
      }
      if (RM.deadline) {
        var xd = x(parseDay(RM.deadline));
        svg.appendChild(s("line", { "class": "tl-dead", x1: xd, y1: topPad - 8, x2: xd, y2: relY + 4 }));
        svg.appendChild(s("text", { "class": "tl-dead-t", x: xd + 4, y: H - 4 }, "deadline ≈"));
      }
      RM.releases.forEach(function (r, i) {
        if (!r.date) return;
        var xr = x(parseDay(r.date));
        svg.appendChild(s("circle", { "class": "tl-rel" + (r.released ? "" : " is-future"), cx: xr, cy: relY + 6, r: 5 }));
        // Alternate label rows so neighbouring releases never overprint.
        svg.appendChild(s("text", { "class": "tl-rel-t", x: xr, y: relY + (i % 2 ? 34 : 22), "text-anchor": "middle" },
          r.version + (r.released ? " ✓" : "")));
      });
      wrap.appendChild(svg);
      return wrap;
    }

    function guide() {
      var det = el("details", "guide");
      det.appendChild(el("summary", null, "Working with Claude Code"));
      var rules = el("div", "rules");
      [
        ["One issue, one session", "One issue = one session = one branch = one draft PR. Start each issue in a new session or after /clear."],
        ["Park everything else", "If Claude spots another bug, typo or refactor, run /park and move on. List what was parked in the PR description."],
        ["A worktree per issue", "claude --worktree, or a git worktree per branch, so parallel sessions never share a checkout."],
        ["Plan first", "Shift+Tab into plan mode, approve the plan, then implement. A plan that outgrows the issue means park the extra part."],
        ["Verify on the pinned toolchain", "The targeted testthat file first, then the bioc-check-ladder skill. The test-author and bioc-reviewer agents give a second look."],
        ["Close the loop", "A NEWS entry under the .9000 heading, the AGENTS.md commit trailer, and a draft PR with Fixes #N. The roadmap picks the PR up by itself."],
        ["Deleting a merged branch", "Use the Delete branch button on the merged PR. git push --delete closes every PR stacked on it instead of retargeting them."],
        ["Keeping this page current", "A hook asks Claude to run /mesa-status before a session that changed GitHub ends. Run it by hand after changes made on github.com."]
      ].forEach(function (r) {
        var d = el("div");
        d.appendChild(el("h3", null, r[0]));
        d.appendChild(el("p", null, r[1]));
        rules.appendChild(d);
      });
      det.appendChild(rules);
      var pre = el("pre", "sh", "Work on #115 only. Read the issue and AGENTS.md, then plan.\nTouch only the files this issue needs. Anything else you notice: /park it, don't fix it.");
      pre.style.marginTop = "14px";
      det.appendChild(el("p", "muted", "A session opener to copy:")).style.marginTop = "14px";
      det.appendChild(pre);
      return det;
    }

    renderNext();

    // ---- tabs -----------------------------------------------------------
    var tabs = [
      { btn: document.getElementById("tab-next"), panel: nextPanel, hash: "next" },
      { btn: document.getElementById("tab-health"), panel: app, hash: "health" }
    ];
    function select(which, focus) {
      tabs.forEach(function (t) {
        var on = t.hash === which;
        t.btn.setAttribute("aria-selected", on ? "true" : "false");
        t.btn.tabIndex = on ? 0 : -1;
        t.panel.hidden = !on;
        if (on && focus) t.btn.focus();
      });
      store("mesa-next-tab", which);
    }
    tabs.forEach(function (t, i) {
      t.btn.addEventListener("click", function () {
        select(t.hash);
        try { history.replaceState(null, "", "#" + t.hash); } catch (e) { /* sandboxed frame */ }
      });
      t.btn.addEventListener("keydown", function (ev) {
        if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
        select(tabs[(i + (ev.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length].hash, true);
      });
    });
    var wanted = (location.hash || "").replace("#", "") || store("mesa-next-tab") || "next";
    select(wanted === "health" ? "health" : "next");
  })();
</script>
